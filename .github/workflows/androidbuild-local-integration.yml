name: Waddle AndroidBuild Local Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

env:
  WADDLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

# One automatic certification owns the canonical workspace. A newer SHA for the
# same PR/ref supersedes an obsolete run. The 15-minute outer watchdog prevents
# any unexpected Windows child-process regression from monopolizing a self-hosted
# runner; inner Setup/Flash/Stop gates have tighter phase-specific timeouts.
concurrency:
  group: waddle-certification-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  certify:
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 15

    steps:
      - name: Resolve AndroidBuild Core and synchronize exact Waddle SHA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:OS -ne 'Windows_NT' -or -not [Environment]::Is64BitOperatingSystem -or -not [Environment]::Is64BitProcess){throw 'WADDLE_CERT=FAIL windows_x64_required'}
          $roots=New-Object System.Collections.Generic.List[string]
          if($env:ANDROIDBUILD_ROOT){$roots.Add([string]$env:ANDROIDBUILD_ROOT)}
          foreach($drive in [IO.DriveInfo]::GetDrives()){
            try{
              if(-not $drive.IsReady){continue}
              $candidate=[IO.Path]::Combine($drive.RootDirectory.FullName,'AndroidBuild')
              if(-not $roots.Contains($candidate)){$roots.Add($candidate)}
            }catch{}
          }
          $root=$null
          foreach($candidate in $roots){
            try{$full=(Resolve-Path -LiteralPath $candidate -ErrorAction Stop).Path}catch{continue}
            if(Test-Path -LiteralPath (Join-Path $full 'Core\Current\AndroidBuild.psd1') -PathType Leaf){$root=$full;break}
          }
          if(-not $root){throw 'WADDLE_CERT=FAIL androidbuild_core_not_found'}
          $env:ANDROIDBUILD_ROOT=$root
          "ANDROIDBUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Import-Module (Join-Path $root 'Core\Current\AndroidBuild.psd1') -Force -DisableNameChecking
          $version=[string](Get-AndroidBuildCoreVersion)
          if([version]$version -lt [version]'3.0.17'){throw "WADDLE_CERT=FAIL core_required=3.0.17 actual=$version"}
          Enable-AndroidBuildPortableTools -AndroidBuildRoot $root | Out-Null
          $repo=Join-Path $root 'Repositories\TEST-Waddle-Forever'
          $sync=Sync-AndroidBuildRepositoryExactHead `
            -RepoRoot $repo `
            -ExpectedSha $env:WADDLE_EXPECTED_SHA `
            -AndroidBuildRoot $root `
            -AllowTrackedReset `
            -CleanUntracked `
            -SourceRemote 'https://github.com/${{ github.repository }}.git' `
            -FetchTimeoutSeconds 7200 `
            -FetchDepth 1
          if([string]$sync.actual_sha -ne [string]$env:WADDLE_EXPECTED_SHA){throw "WADDLE_CERT=FAIL exact_head expected=$env:WADDLE_EXPECTED_SHA actual=$($sync.actual_sha)"}
          "WADDLE_CANONICAL_REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "WADDLE_CERT_SYNC=PASS repo=$repo sha=$($sync.actual_sha) core=$version"

      - name: Sanitize inherited Waddle clients before dependency setup
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:WADDLE_CANONICAL_REPO
          try {
            $env:WADDLE_NONINTERACTIVE='1'
            & cmd.exe /d /c 'Waddle-Stop.cmd'
            $code=$LASTEXITCODE
            $global:LASTEXITCODE=0
            if($code -ne 0){throw "WADDLE_CERT=FAIL preclean_stop_exit=$code"}
          } finally {
            Remove-Item Env:WADDLE_NONINTERACTIVE -ErrorAction SilentlyContinue
            Pop-Location
          }
          Write-Host 'WADDLE_CERT_PRECLEAN=PASS'

      - name: Run complete Waddle certification
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $script=Join-Path $env:WADDLE_CANONICAL_REPO '.github\scripts\waddle-certification.ps1'
          if(-not(Test-Path -LiteralPath $script -PathType Leaf)){throw "WADDLE_CERT=FAIL script_missing=$script"}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $script `
            -ExpectedSha $env:WADDLE_EXPECTED_SHA `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -JobId '${{ github.job }}' `
            -RunnerName $env:RUNNER_NAME `
            -AndroidBuildRoot $env:ANDROIDBUILD_ROOT
          if($LASTEXITCODE -ne 0){throw "WADDLE_CERT=FAIL certification_exit=$LASTEXITCODE"}

      - name: Build incremental SWF dependency analysis
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo=$env:WADDLE_CANONICAL_REPO
          $analyzer=Join-Path $repo '.github\scripts\waddle-swf-analysis.ps1'
          if(-not(Test-Path -LiteralPath $analyzer -PathType Leaf)){throw "WADDLE_SWF_ANALYSIS=FAIL analyzer_missing=$analyzer"}

          # FFDec is build/analysis tooling, not a runtime dependency. Resolve it
          # from the managed .env produced by Setup instead of coupling Play to
          # AndroidBuild tooling through waddle-client.json.
          $ffdec=''
          $envPath=Join-Path $repo '.env'
          if(Test-Path -LiteralPath $envPath -PathType Leaf){
            foreach($raw in Get-Content -LiteralPath $envPath){
              $line=[string]$raw
              if($line -match '^\s*FFDEC_PATH\s*=\s*(.+?)\s*$'){
                $ffdec=([string]$Matches[1]).Trim().Trim('"')
                break
              }
            }
          }
          if([string]::IsNullOrWhiteSpace($ffdec) -or -not(Test-Path -LiteralPath $ffdec -PathType Leaf)){
            throw "WADDLE_SWF_ANALYSIS=FAIL setup_ffdec_missing=$ffdec env=$envPath"
          }
          Write-Host "WADDLE_SWF_ANALYSIS_FFDEC=PASS source=setup_env path=$ffdec"

          # Keep the PR gate bounded. The analyzer is hash-cached and therefore
          # advances deep coverage across runs rather than rescanning the whole
          # archive on every source commit. boots.swf remains first priority.
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $analyzer `
            -RepoRoot $repo `
            -WorkRoot (Join-Path $repo '.work') `
            -FFDecPath $ffdec `
            -DeepBudget 2 `
            -FFDecTimeoutSeconds 8
          if($LASTEXITCODE -ne 0){throw "WADDLE_SWF_ANALYSIS=FAIL exit=$LASTEXITCODE"}
          $summary=Join-Path $repo '.work\swf-analysis\summary.json'
          if(-not(Test-Path -LiteralPath $summary -PathType Leaf)){throw "WADDLE_SWF_ANALYSIS=FAIL summary_missing=$summary"}
          Get-Content -LiteralPath $summary -Raw | Write-Host
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -Force -DisableNameChecking
          Test-AndroidBuildExactHead -RepoRoot $repo -ExpectedSha $env:WADDLE_EXPECTED_SHA -AndroidBuildRoot $env:ANDROIDBUILD_ROOT | Out-Null
          Write-Host "WADDLE_SWF_ANALYSIS_EXACT_HEAD=PASS sha=$env:WADDLE_EXPECTED_SHA"

      - name: Correlate runtime and SWF diagnostics
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo=$env:WADDLE_CANONICAL_REPO
          if([string]::IsNullOrWhiteSpace($repo) -or -not(Test-Path -LiteralPath $repo -PathType Container)){
            Write-Host 'WADDLE_DIAGNOSTICS=SKIP reason=canonical_repo_unavailable'
            exit 0
          }
          $diagnoser=Join-Path $repo '.github\scripts\waddle-diagnostics.ps1'
          if(-not(Test-Path -LiteralPath $diagnoser -PathType Leaf)){throw "WADDLE_DIAGNOSTICS=FAIL script_missing=$diagnoser"}
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $diagnoser `
            -RepoRoot $repo `
            -WorkRoot (Join-Path $repo '.work') `
            -FailOnCritical
          if($LASTEXITCODE -ne 0){throw "WADDLE_DIAGNOSTICS=FAIL exit=$LASTEXITCODE"}
          $summary=Join-Path $repo '.work\diagnostics\latest\summary.json'
          if(-not(Test-Path -LiteralPath $summary -PathType Leaf)){throw "WADDLE_DIAGNOSTICS=FAIL summary_missing=$summary"}
          Get-Content -LiteralPath $summary -Raw | Write-Host
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -Force -DisableNameChecking
          Test-AndroidBuildExactHead -RepoRoot $repo -ExpectedSha $env:WADDLE_EXPECTED_SHA -AndroidBuildRoot $env:ANDROIDBUILD_ROOT | Out-Null
          Write-Host "WADDLE_DIAGNOSTICS_EXACT_HEAD=PASS sha=$env:WADDLE_EXPECTED_SHA"

      - name: Emit diagnostic context on failure
        if: failure()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          $repo=$env:WADDLE_CANONICAL_REPO
          if(-not $repo){$repo=Join-Path $env:ANDROIDBUILD_ROOT 'Repositories\TEST-Waddle-Forever'}
          $work=Join-Path $repo '.work'
          foreach($relative in @(
            'state\waddle-certification.json',
            'state\flash-runtime-probe.json',
            'state\waddle-client.json',
            'state\waddle-build-summary.json',
            'state\runtime-snapshot.json',
            'swf-analysis\summary.json',
            'swf-analysis\missing-swfs.json',
            'swf-analysis\runtime-trace.json',
            'diagnostics\latest\summary.json',
            'diagnostics\latest\issues.json',
            'diagnostics\latest\report.txt',
            'diagnostics\latest\resource-failures.json',
            'diagnostics\latest\slow-resources.json',
            'logs\certification\setup.stdout.log',
            'logs\certification\setup.stderr.log',
            'logs\certification\flash-runtime-probe.stdout.log',
            'logs\certification\flash-runtime-probe.stderr.log',
            'logs\certification\stop.stdout.log',
            'logs\certification\stop.stderr.log',
            'logs\launcher\setup-last.log',
            'logs\launcher\start-last.log',
            'logs\launcher\stop-last.log'
          )){
            $path=Join-Path $work $relative
            Write-Host "----- $relative -----"
            if(Test-Path -LiteralPath $path -PathType Leaf){Get-Content -LiteralPath $path -Tail 240 | Write-Host}else{Write-Host 'MISSING'}
          }
          Write-Host '----- Waddle Electron processes -----'
          Get-CimInstance Win32_Process -Filter "Name='electron.exe'" -ErrorAction SilentlyContinue |
            Where-Object { [string]$_.ExecutablePath -match 'Waddle-Forever|TEST-Waddle-Forever' } |
            Select-Object ProcessId,ParentProcessId,ExecutablePath,CommandLine |
            Format-List | Out-String -Width 500 | Write-Host
