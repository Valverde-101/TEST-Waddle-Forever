name: One-shot puffle static route patch

on:
  push:
    branches:
      - fix/runtime-outside-work-20260906

permissions:
  contents: write

jobs:
  patch:
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Register canonical puffle SWF routes through GitHub API
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $file = 'src/server/game-data/as3-static.ts'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $escapedPath = ($file -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
          $getUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/contents/${escapedPath}?ref=$env:GITHUB_REF_NAME"
          $response = Invoke-RestMethod -Headers $headers -Uri $getUri -Method Get
          $bytes = [Convert]::FromBase64String(([string]$response.content -replace '\s',''))
          $text = [Text.Encoding]::UTF8.GetString($bytes)

          if ($text.Contains('const PUFFLE_STATIC_FILES: RouteRefMap = {};')) {
            Write-Host 'PUFFLE_ROUTE_PATCH=SKIP already_present=true'
            exit 0
          }

          $importNeedle = 'import { RouteRefMap } from ".";'
          if (-not $text.Contains($importNeedle)) {
            throw 'PUFFLE_ROUTE_PATCH=FAIL import_anchor_not_found'
          }

          $importLines = @(
            'import path from "path";',
            'import { DEFAULT_DIRECTORY, getFilesInDirectory } from "@common/utils";',
            'import { RouteRefMap } from ".";',
            '',
            'const PUFFLE_ROUTE_PREFIX = "play/v2/content/global/puffle";',
            'const PUFFLE_FILE_REF_PREFIX = "svanilla:media/play/v2/content/global/puffle";',
            'const PUFFLE_DIRECTORY = path.join(',
            '  DEFAULT_DIRECTORY,',
            '  "svanilla",',
            '  "media",',
            '  "play",',
            '  "v2",',
            '  "content",',
            '  "global",',
            '  "puffle"',
            ');',
            '',
            '/**',
            ' * Register every canonical puffle SWF already present in Waddle media.',
            ' * This stays inside AS3_STATIC_FILES; explicit routes below still win',
            ' * whenever Waddle needs a special per-file override.',
            ' */',
            'const PUFFLE_STATIC_FILES: RouteRefMap = {};',
            'getFilesInDirectory(PUFFLE_DIRECTORY)',
            '  .filter((file) => file.toLowerCase().endsWith(".swf"))',
            '  .forEach((file) => {',
            '    const normalizedFile = file.replace(/\\/g, "/");',
            '    PUFFLE_STATIC_FILES[`${PUFFLE_ROUTE_PREFIX}/${normalizedFile}`] =',
            '      `${PUFFLE_FILE_REF_PREFIX}/${normalizedFile}`;',
            '  });'
          ) -join "`n"

          $text = $text.Replace($importNeedle, $importLines)
          $mapNeedle = 'export const AS3_STATIC_FILES: RouteRefMap = {'
          if (-not $text.Contains($mapNeedle)) {
            throw 'PUFFLE_ROUTE_PATCH=FAIL map_anchor_not_found'
          }
          $text = $text.Replace($mapNeedle, $mapNeedle + "`n  ...PUFFLE_STATIC_FILES,")

          $newBytes = [Text.UTF8Encoding]::new($false).GetBytes($text)
          $payload = @{
            message = 'fix(puffle): register uploaded SWF routes [puffle-route-patch]'
            content = [Convert]::ToBase64String($newBytes)
            sha = [string]$response.sha
            branch = $env:GITHUB_REF_NAME
          } | ConvertTo-Json -Depth 4

          $putUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/contents/$escapedPath"
          $result = Invoke-RestMethod -Headers $headers -Uri $putUri -Method Put -Body $payload -ContentType 'application/json'
          Write-Host "PUFFLE_ROUTE_PATCH=PASS file=$file commit=$($result.commit.sha) explicit_routes_win=true"
