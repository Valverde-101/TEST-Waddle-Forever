name: Waddle The Fair 2015 Source Discovery

on:
  push:
    branches: [feat/the-fair-2015]
    paths:
      - '.github/scripts/waddle-fair-2015-import.py'
      - '.github/workflows/waddle-fair-2015.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waddle-fair-2015-source-discovery
  cancel-in-progress: true

jobs:
  discover-historical-fair-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate Python importer syntax
        run: python -m py_compile .github/scripts/waddle-fair-2015-import.py
      - name: Discover historical 2015 Fair source files
        run: python .github/scripts/waddle-fair-2015-import.py --repo-root . --discover-only
