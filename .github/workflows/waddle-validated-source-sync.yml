name: Waddle Validated Source Sync

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read
  actions: read

concurrency:
  # A newer commit supersedes an older preview activation for the same PR/branch.
  # Exact-SHA certification is still enforced inside the job.
  group: waddle-validated-source-sync-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  wait-certification:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      certification_run_id: ${{ steps.gate.outputs.run_id }}
    env:
      WADDLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - id: gate
        name: Wait for exact-SHA certification success
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $headers=@{
            Authorization="Bearer $env:GH_READ_TOKEN"
            Accept='application/vnd.github+json'
            'X-GitHub-Api-Version'='2022-11-28'
            'User-Agent'='waddle-validated-source-sync'
          }
          $sha=$env:WADDLE_EXPECTED_SHA.Trim().ToLowerInvariant()
          $deadline=[DateTime]::UtcNow.AddMinutes(24)
          while([DateTime]::UtcNow -lt $deadline){
            $uri="https://api.github.com/repos/${{ github.repository }}/actions/runs?head_sha=$sha&per_page=100"
            $response=Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 30
            $cert=@($response.workflow_runs | Where-Object {
              $_.name -eq 'Waddle AndroidBuild Local Integration' -and ([string]$_.head_sha).ToLowerInvariant() -eq $sha
            } | Sort-Object {[DateTime]$_.created_at} -Descending | Select-Object -First 1)
            if($cert.Count -gt 0){
              $run=$cert[0]
              Write-Host "VALIDATED_SOURCE_SYNC_GATE=WAIT run_id=$($run.id) status=$($run.status) conclusion=$($run.conclusion) sha=$sha"
              if($run.status -eq 'completed'){
                if($run.conclusion -ne 'success'){throw "VALIDATED_SOURCE_SYNC=FAIL certification_run=$($run.id) conclusion=$($run.conclusion) sha=$sha"}
                "run_id=$($run.id)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
                Write-Host "VALIDATED_SOURCE_SYNC_GATE=PASS certification_run=$($run.id) sha=$sha"
                exit 0
              }
            }else{
              Write-Host "VALIDATED_SOURCE_SYNC_GATE=WAIT reason=certification_run_not_visible_yet sha=$sha"
            }
            Start-Sleep -Seconds 10
          }
          throw "VALIDATED_SOURCE_SYNC=FAIL certification_timeout sha=$sha"

  sync-live:
    needs: wait-certification
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 45
    env:
      WADDLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      WADDLE_TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
      WADDLE_CERT_RUN_ID: ${{ needs.wait-certification.outputs.certification_run_id }}
      WADDLE_EVENT_NAME: ${{ github.event_name }}
    steps:
      - name: Resolve AndroidBuild Core and canonical repository
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $roots=New-Object System.Collections.Generic.List[string]
          if($env:ANDROIDBUILD_ROOT){$roots.Add([string]$env:ANDROIDBUILD_ROOT)}
          foreach($drive in [IO.DriveInfo]::GetDrives()){
            try{
              if(-not $drive.IsReady){continue}
              $candidate=[IO.Path]::Combine($drive.RootDirectory.FullName,'AndroidBuild')
              if(-not $roots.Contains($candidate)){$roots.Add($candidate)}
            }catch{}
          }
          $root=$null
          foreach($candidate in $roots){
            try{$full=(Resolve-Path -LiteralPath $candidate -ErrorAction Stop).Path}catch{continue}
            if(Test-Path -LiteralPath (Join-Path $full 'Core\Current\AndroidBuild.psd1') -PathType Leaf){$root=$full;break}
          }
          if(-not $root){throw 'VALIDATED_SOURCE_SYNC=FAIL androidbuild_core_not_found'}
          Import-Module (Join-Path $root 'Core\Current\AndroidBuild.psd1') -DisableNameChecking -Force -WarningAction SilentlyContinue
          $coreVersion=[string](Get-AndroidBuildCoreVersion)
          Enable-AndroidBuildPortableTools -AndroidBuildRoot $root | Out-Null
          $git=[string](Get-AndroidBuildGitPath -AndroidBuildRoot $root)
          if(-not(Test-Path -LiteralPath $git -PathType Leaf)){throw "VALIDATED_SOURCE_SYNC=FAIL managed_git_missing=$git"}
          $repo=Join-Path $root 'Repositories\TEST-Waddle-Forever'
          if(-not(Test-Path -LiteralPath (Join-Path $repo '.git'))){throw "VALIDATED_SOURCE_SYNC=FAIL canonical_repo_missing=$repo"}
          "ANDROIDBUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WADDLE_CANONICAL_REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WADDLE_MANAGED_GIT=$git" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WADDLE_CORE_VERSION=$coreVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VALIDATED_SOURCE_SYNC_CORE=PASS root=$root core=$coreVersion git=$git canonical_repo=$repo"

      - id: policy
        name: Select physical runtime policy
        shell: powershell
        run: |
          $preview=($env:WADDLE_EVENT_NAME -eq 'pull_request' -and $env:WADDLE_TARGET_BRANCH -match '^(feat|party)/')
          $promote=($env:WADDLE_EVENT_NAME -eq 'push' -and $env:WADDLE_TARGET_BRANCH -eq 'dev')
          "run=$($preview.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "promote=$($promote.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          if($preview){
            Write-Host "VALIDATED_SOURCE_SYNC_POLICY=PASS mode=isolated_preview target=$env:WADDLE_TARGET_BRANCH"
          }elseif($promote){
            Write-Host "VALIDATED_SOURCE_SYNC_POLICY=PASS mode=canonical_dev_promotion target=$env:WADDLE_TARGET_BRANCH"
          }else{
            Write-Host "VALIDATED_SOURCE_SYNC=PASS mode=no_live_activation target=$env:WADDLE_TARGET_BRANCH canonical_mutation=false"
          }

      - name: Materialize exact-SHA certified preview launcher
        if: steps.policy.outputs.run == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $git=$env:WADDLE_MANAGED_GIT
          $repo=$env:WADDLE_CANONICAL_REPO
          $sha=$env:WADDLE_EXPECTED_SHA.Trim().ToLowerInvariant()
          $ref="refs/remotes/waddle-materialize/$($env:WADDLE_TARGET_BRANCH)"
          $refspec=("+refs/heads/{0}:{1}" -f $env:WADDLE_TARGET_BRANCH,$ref)
          & $git -c "safe.directory=$repo" -C $repo fetch --force --no-tags 'https://github.com/${{ github.repository }}.git' $refspec
          if($LASTEXITCODE -ne 0){throw "VALIDATED_SOURCE_SYNC=FAIL materialize_fetch branch=$env:WADDLE_TARGET_BRANCH"}
          $global:LASTEXITCODE=0
          $branchHead=(& $git -c "safe.directory=$repo" -C $repo rev-parse $ref | Out-String).Trim().ToLowerInvariant()
          if($LASTEXITCODE -ne 0){throw "VALIDATED_SOURCE_SYNC=FAIL materialize_branch_head branch=$env:WADDLE_TARGET_BRANCH"}
          $global:LASTEXITCODE=0
          & $git -c "safe.directory=$repo" -C $repo cat-file -e "$sha^{commit}"
          if($LASTEXITCODE -ne 0){throw "VALIDATED_SOURCE_SYNC=FAIL certified_sha_not_fetched sha=$sha branch_head=$branchHead"}
          $global:LASTEXITCODE=0
          & $git -c "safe.directory=$repo" -C $repo merge-base --is-ancestor $sha $ref
          if($LASTEXITCODE -ne 0){throw "VALIDATED_SOURCE_SYNC=FAIL certified_sha_not_on_target_branch sha=$sha branch_head=$branchHead"}
          $global:LASTEXITCODE=0
          $dir=Join-Path $env:ANDROIDBUILD_ROOT 'Certification\Waddle-Preview'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $scriptPath=Join-Path $dir ("waddle-certified-preview-$sha.ps1")
          $content=@(& $git -c "safe.directory=$repo" -C $repo show "${sha}:.github/scripts/waddle-certified-preview.ps1")
          if($LASTEXITCODE -ne 0 -or $content.Count -lt 40){throw "VALIDATED_SOURCE_SYNC=FAIL preview_launcher_unavailable sha=$sha"}
          $global:LASTEXITCODE=0
          [IO.File]::WriteAllLines($scriptPath,[string[]]$content,(New-Object Text.UTF8Encoding($false)))
          "WADDLE_CERTIFIED_PREVIEW_SCRIPT=$scriptPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VALIDATED_SOURCE_SYNC_SCRIPT=PASS sha=$sha path=$scriptPath canonical_worktree_mutated=false"

      - name: Activate isolated exact-SHA certified preview
        if: steps.policy.outputs.run == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest

          # GitHub's self-hosted runner tags descendants with RUNNER_TRACKING_ID and
          # kills them as orphans at job teardown. Remove that tag only while spawning
          # the certified preview so Electron survives after CI; restore it immediately
          # for the runner-owned shell and all subsequent validation commands.
          $trackingId=$env:RUNNER_TRACKING_ID
          try {
            Remove-Item Env:\RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            Write-Host 'VALIDATED_SOURCE_SYNC_DETACH=PASS runner_tracking_removed_for_preview=true'
            & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:WADDLE_CERTIFIED_PREVIEW_SCRIPT `
              -AndroidBuildRoot $env:ANDROIDBUILD_ROOT `
              -SourceRepoRoot $env:WADDLE_CANONICAL_REPO `
              -Repository '${{ github.repository }}' `
              -TargetBranch $env:WADDLE_TARGET_BRANCH `
              -ExpectedSha $env:WADDLE_EXPECTED_SHA `
              -CertificationRunId $env:WADDLE_CERT_RUN_ID
            $code=$LASTEXITCODE
            $global:LASTEXITCODE=0
          } finally {
            if([string]::IsNullOrEmpty($trackingId)){
              Remove-Item Env:\RUNNER_TRACKING_ID -ErrorAction SilentlyContinue
            }else{
              $env:RUNNER_TRACKING_ID=$trackingId
            }
          }
          if($code -ne 0){throw "VALIDATED_SOURCE_SYNC=FAIL isolated_preview_exit=$code"}

          $safeTarget=[regex]::Replace($env:WADDLE_TARGET_BRANCH,'[^A-Za-z0-9._-]','_')
          $previewRoot=Join-Path $env:ANDROIDBUILD_ROOT ("Previews\Waddle-Forever\$safeTarget")
          $verify=Join-Path $previewRoot '.github\scripts\waddle-modern-timeline-verify.ps1'
          if(-not(Test-Path -LiteralPath $verify -PathType Leaf)){throw "VALIDATED_SOURCE_SYNC=FAIL timeline_verifier_missing=$verify"}
          # Temporary update end dates are exclusive. Nov 5 means Nov 4 remains playable.
          & $verify -RepoRoot $previewRoot -RequiredThroughYear 2017 -RequiredDates @('2015-10-21','2015-11-05')
          if($LASTEXITCODE -ne 0){throw 'VALIDATED_SOURCE_SYNC=FAIL compiled_timeline_verification'}
          $global:LASTEXITCODE=0
          Write-Host "VALIDATED_SOURCE_SYNC_TIMELINE=PASS preview=$previewRoot picker_through=2017 compiled=true exclusive_party_end=2015-11-05"

      - name: Materialize canonical promotion launcher
        if: steps.policy.outputs.promote == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $git=$env:WADDLE_MANAGED_GIT
          $repo=$env:WADDLE_CANONICAL_REPO
          $sha=$env:WADDLE_EXPECTED_SHA.Trim().ToLowerInvariant()
          $dir=Join-Path $env:ANDROIDBUILD_ROOT 'Certification\\Waddle-Promote'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $scriptPath=Join-Path $dir ("waddle-promote-certified-dev-$sha.ps1")
          $content=@(& $git -c "safe.directory=$repo" -C $repo show "$($sha):.github/scripts/waddle-promote-certified-dev.ps1")
          if($LASTEXITCODE -ne 0 -or $content.Count -lt 80){throw "VALIDATED_SOURCE_SYNC=FAIL promotion_launcher_unavailable sha=$sha"}
          $global:LASTEXITCODE=0
          [IO.File]::WriteAllLines($scriptPath,[string[]]$content,(New-Object Text.UTF8Encoding($false)))
          "WADDLE_PROMOTION_SCRIPT=$scriptPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "VALIDATED_SOURCE_SYNC_PROMOTION_SCRIPT=PASS sha=$sha path=$scriptPath"

      - name: Promote certified dev into canonical physical checkout
        if: steps.policy.outputs.promote == 'true'
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File $env:WADDLE_PROMOTION_SCRIPT -AndroidBuildRoot $env:ANDROIDBUILD_ROOT -Repository '${{ github.repository }}' -ExpectedSha $env:WADDLE_EXPECTED_SHA -TargetBranch 'dev' -CertificationRunId $env:WADDLE_CERT_RUN_ID
          if($LASTEXITCODE -ne 0){throw "VALIDATED_SOURCE_SYNC=FAIL canonical_promotion_exit=$LASTEXITCODE"}
          Write-Host "VALIDATED_SOURCE_SYNC=PASS mode=canonical_dev_promoted sha=$env:WADDLE_EXPECTED_SHA repo=$env:WADDLE_CANONICAL_REPO"

