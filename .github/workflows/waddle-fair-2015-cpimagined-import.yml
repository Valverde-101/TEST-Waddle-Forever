name: Waddle The Fair 2015 Isolated Runtime Import
on:
  push:
    branches: [feat/the-fair-2015]
    paths:
      - '.github/scripts/waddle-fair-2015-cpimagined-import.py'
      - '.github/workflows/waddle-fair-2015-cpimagined-import.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: waddle-fair-2015-cpimagined-runtime-import
  cancel-in-progress: false
jobs:
  import-only-audited-missing-fair-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate isolated importer
        run: python -m py_compile .github/scripts/waddle-fair-2015-cpimagined-import.py
      - name: Acquire three pinned Fair-only files and deduplicate shared originals
        run: python .github/scripts/waddle-fair-2015-cpimagined-import.py
      - name: Publish only isolated Fair assets on existing PR branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- media/default/fair2015/cpimagined/content/party.swf media/default/fair2015/cpimagined/content/map.swf media/default/fair2015/cpimagined/content/room_pin/7236.swf media/default/fair2015/cpimagined/manifest.json
          if git diff --cached --quiet; then
            echo WADDLE_FAIR_CPIMAGINED_PUBLISH=PASS mode=already_pinned
          else
            git commit -m 'Archive three independently pinned May Fair 2015 assets'
            git push origin HEAD:refs/heads/feat/the-fair-2015
            echo WADDLE_FAIR_CPIMAGINED_PUBLISH=PASS mode=feature_branch_only
          fi
