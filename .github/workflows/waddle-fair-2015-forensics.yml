name: Waddle The Fair 2015 Runtime Forensics

on:
  push:
    branches: [feat/the-fair-2015]
    paths:
      - '.github/workflows/waddle-fair-2015-forensics.yml'
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/waddle-fair-2015-forensics.yml'
      - 'src/server/updates/2015.ts'
      - 'src/server/file-generators/index.ts'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: waddle-fair-2015-runtime-forensics
  cancel-in-progress: true

jobs:
  inspect-original-client-contracts:
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Extract archived Fair client and game runtime contracts
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $root=$env:GITHUB_WORKSPACE
          $ffdec=Get-ChildItem -LiteralPath 'V:\AndroidBuild\Tools\FFDec' -Filter 'ffdec-cli.exe' -Recurse -File | Sort-Object FullName -Descending | Select-Object -First 1
          if(-not $ffdec){throw 'WADDLE_FAIR_FORENSICS=FAIL ffdec_missing'}
          $work=Join-Path $env:RUNNER_TEMP 'fair2015-forensics'
          New-Item -ItemType Directory -Force -Path $work | Out-Null
          $samples=[ordered]@{
            fair_icon='media/default/fair2015/content/ContentParty_icon-TheFair2015.swf'
            fair_interface='media/default/fair2015/client/ClientInterfaceFair2015.swf'
            fair_spin_bootstrap='media/default/fair2015/minigames/daily_spin/GamesSpinBootstrap.swf'
            fair_spin_main='media/default/fair2015/minigames/daily_spin/GamesSpinMain.swf'
            fair_paddle_bootstrap='media/default/fair2015/minigames/puffle_paddle/GamesPufflePaddle-Bootstrap-TheFair2015.swf'
            fair_plaza='media/default/fair2015/rooms/RoomsPlaza-TheFair2015.swf'
            fair_plaza_mall='media/default/fair2015/rooms/RoomsPlaza-TheFair2015Mall.swf'
            fair_map_derived='media/default/fair2015/compat/FairIslandMap.swf'
            archived_stage_may='media/default/archives/RoomsStage-21Apr2015.swf'
            fair_map_note='media/default/fair2015/close_ups/ENCloseUpsPartyMapNote-TheFair2015.swf'
            fair_party_map='media/default/fair2015/close_ups/ENCloseUpsPartyMap-TheFair2015.swf'
            vanilla_map='media/default/approximation/modern_map.swf'
            generic_party='media/default/svanilla/media/play/v2/content/global/content/party.swf'
            ghost_party='media/default/unknown/ghosts/party.swf'
            late2015_party='media/default/party2015/content/party-runtime-2015-base.swf'
          }
          foreach($sample in $samples.GetEnumerator()){
            $path=Join-Path $root $sample.Value
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "WADDLE_FAIR_FORENSICS=FAIL missing=$path"}
            $out=Join-Path $work $sample.Key
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            $previous=$ErrorActionPreference; $ErrorActionPreference='Continue'
            try {
              $logs=@(& $ffdec.FullName -cli -onerror abort -exportTimeout 90 -exportFileTimeout 30 -export script $out $path 2>&1 | Out-String)
              $exit=$LASTEXITCODE
            } finally { $ErrorActionPreference=$previous }
            if($exit-ne0){throw "WADDLE_FAIR_FORENSICS=FAIL sample=$($sample.Key) ffdec_exit=$exit log=$($logs -join ' ')"}
            $scriptFiles=@(Get-ChildItem -LiteralPath $out -Filter '*.as' -Recurse -File)
            $tokens='FairParty|ServerCookieService|partyCookie|party_icon|partyinterface|ticket|silverTicket|spinDayIndex|cp_party_games|send.*Game|dailyspin|bootstrap\.swf|features\.swf|QuestInterface|PartyMap'
            $matches=@($scriptFiles | Select-String -Pattern $tokens -CaseSensitive:$false | Select-Object -First 95 | ForEach-Object {
              '{0}:{1} {2}' -f $_.Path.Substring($out.Length+1),$_.LineNumber,$_.Line.Trim()
            })
            Write-Host "WADDLE_FAIR_FORENSICS=PASS sample=$($sample.Key) bytes=$((Get-Item $path).Length) scripts=$($scriptFiles.Count) matches=$($matches.Count)"
            foreach($line in $matches){Write-Host "WADDLE_FAIR_CONTRACT sample=$($sample.Key) $line"}
            if($sample.Key -in @('fair_map_note','fair_party_map','vanilla_map')) {
              $mapSource = @($scriptFiles | Select-String -Pattern 'party_map_note|party_map|w\\.party\\.map|mapNote|goThereBtn|showContent|showMap|mapBtn|loadMovie|addEventListener|onRelease|onPress|openMap|switch' -CaseSensitive:$false | Select-Object -First 150 | ForEach-Object {
                '{0}:{1} {2}' -f $_.Path.Substring($out.Length+1),$_.LineNumber,$_.Line.Trim()
              })
              Write-Host "WADDLE_FAIR_MAP_SOURCE sample=$($sample.Key) matches=$($mapSource.Count)"
              foreach($line in $mapSource){Write-Host "WADDLE_FAIR_MAP_SOURCE sample=$($sample.Key) $line"}
              $targetSources = if ($sample.Key -eq 'vanilla_map') {
                @(@{Path='scripts/frame_1/DoAction.as'; Start=370; End=455}, @{Path='scripts/frame_1/DoAction.as'; Start=605; End=660})
              } elseif ($sample.Key -eq 'fair_map_note') {
                @(@{Path='scripts/frame_1/DoAction.as'; Start=1; End=50})
              } else {
                @(@{Path='scripts/__Packages/com/clubpenguin/world/rooms2015/may/ui/PartyMap.as'; Start=1; End=125})
              }
              foreach($segment in $targetSources){
                $file=Join-Path $out $segment.Path
                if(-not(Test-Path -LiteralPath $file -PathType Leaf)) { Write-Host "WADDLE_FAIR_MAP_DETAIL_MISSING=$($sample.Key)/$($segment.Path)"; continue }
                $detail=@(Get-Content -LiteralPath $file)
                for($idx=$segment.Start-1;$idx -lt [Math]::Min($segment.End,$detail.Count);$idx++){
                  Write-Host ("WADDLE_FAIR_MAP_DETAIL sample={0} path={1}:{2} {3}" -f $sample.Key,$segment.Path,($idx+1),$detail[$idx])
                }
              }
            }
            if($sample.Key -in @('fair_plaza','fair_plaza_mall')){
              $plazaCode=@($scriptFiles | Where-Object {$_.FullName -match '[\\/]world[\\/]rooms[\\/]Plaza\\.as
              $source=@($scriptFiles | Select-String -Pattern 'stage|mall|340|gotoroom|joinRoom|joinroom|puffle|hotel|pet|pufflepark|pufflewild|puffle_shop|puffleShop|\.onRelease|\.onPress|clickMap|goThereBtn' -CaseSensitive:$false | Select-Object -First 185 | ForEach-Object {
                '{0}:{1} {2}' -f $_.Path.Substring($out.Length+1),$_.LineNumber,$_.Line.Trim()
              })
              Write-Host "WADDLE_FAIR_STAGE_MAP_AUDIT sample=$($sample.Key) matches=$($source.Count)"
              foreach($entry in $source){Write-Host "WADDLE_FAIR_STAGE_MAP_AUDIT sample=$($sample.Key) $entry"}
              if($sample.Key -eq 'fair_plaza' -or $sample.Key -eq 'fair_map_derived'){
                foreach($candidate in @('scripts/frame_1/DoAction.as','scripts/frame_2/DoAction.as')){
                  $srcFile=Join-Path $out $candidate
                  if(-not(Test-Path -LiteralPath $srcFile)){continue}
                  $text=@(Get-Content -LiteralPath $srcFile)
                  for($n=0;$n -lt [Math]::Min($text.Count,850);$n++){
                    Write-Host ("WADDLE_FAIR_STAGE_MAP_CODE sample={0} path={1}:{2} {3}" -f $sample.Key,$candidate,($n+1),$text[$n])
                  }
                }
              }
            }
            if($sample.Key -eq 'fair_spin_bootstrap'){
              foreach($script in $scriptFiles){
                $relative=$script.FullName.Substring($out.Length+1)
                $lines=@(Get-Content -LiteralPath $script.FullName)
                Write-Host "WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE_BEGIN path=$relative total=$($lines.Count)"
                for($idx=0;$idx -lt [Math]::Min($lines.Count,200);$idx++){
                  Write-Host ("WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE {0}:{1} {2}" -f $relative,($idx+1),$lines[$idx])
                }
                Write-Host "WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE_END path=$relative"
              }
            }
            if($sample.Key -eq 'fair_spin_main'){
              $found=@($scriptFiles | Select-String -Pattern 'undefined|main.swf|bootstrap.swf|game_configs|spin\\/|getPath|gameURL|GameURL|send.*Game|loadMovie|loadBytes|getGame|showGame' -CaseSensitive:$false | Select-Object -First 180 | ForEach-Object {
                '{0}:{1} {2}' -f $_.Path.Substring($out.Length+1),$_.LineNumber,$_.Line.Trim()
              })
              Write-Host "WADDLE_FAIR_SPIN_MAIN_REFERENCES=$($found.Count)"
              foreach($line in $found){Write-Host "WADDLE_FAIR_SPIN_MAIN_REFERENCE $line"}
            }
          $fairScripts=Join-Path $work 'fair_spin_main\scripts'
          $primary=@(
            'frame_1\DoAction.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\party\MayParty.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\vo\MayPartyCookieVO.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\party\MayPartyConstants.as',
            '__Packages\com\clubpenguin\spin\Game.as'
          )
          foreach($relative in $primary){
            $file=Join-Path $fairScripts $relative
            if(-not(Test-Path -LiteralPath $file -PathType Leaf)){
              Write-Host "WADDLE_FAIR_SOURCE_MISSING=$relative"
              continue
            }
            $lines=@(Get-Content -LiteralPath $file)
            $limit=if($relative -like '*MayParty.as') {340} elseif($relative -like '*Game.as') {125} else {190}
            Write-Host "WADDLE_FAIR_SOURCE_BEGIN file=$relative lines=$($lines.Count) shown=$([Math]::Min($limit,$lines.Count))"
            for($idx=0;$idx -lt [Math]::Min($limit,$lines.Count);$idx++){
              Write-Host ("WADDLE_FAIR_SOURCE {0}:{1} {2}" -f $relative,($idx+1),$lines[$idx])
            }
            Write-Host "WADDLE_FAIR_SOURCE_END file=$relative"
          }
          }
 -or $_.FullName -match 'frame_1[\\/]DoAction\\.as
              $source=@($scriptFiles | Select-String -Pattern 'stage|mall|340|gotoroom|joinRoom|joinroom|puffle|hotel|pet|pufflepark|pufflewild|puffle_shop|puffleShop|\.onRelease|\.onPress|clickMap|goThereBtn' -CaseSensitive:$false | Select-Object -First 185 | ForEach-Object {
                '{0}:{1} {2}' -f $_.Path.Substring($out.Length+1),$_.LineNumber,$_.Line.Trim()
              })
              Write-Host "WADDLE_FAIR_STAGE_MAP_AUDIT sample=$($sample.Key) matches=$($source.Count)"
              foreach($entry in $source){Write-Host "WADDLE_FAIR_STAGE_MAP_AUDIT sample=$($sample.Key) $entry"}
              if($sample.Key -eq 'fair_plaza' -or $sample.Key -eq 'fair_map_derived'){
                foreach($candidate in @('scripts/frame_1/DoAction.as','scripts/frame_2/DoAction.as')){
                  $srcFile=Join-Path $out $candidate
                  if(-not(Test-Path -LiteralPath $srcFile)){continue}
                  $text=@(Get-Content -LiteralPath $srcFile)
                  for($n=0;$n -lt [Math]::Min($text.Count,850);$n++){
                    Write-Host ("WADDLE_FAIR_STAGE_MAP_CODE sample={0} path={1}:{2} {3}" -f $sample.Key,$candidate,($n+1),$text[$n])
                  }
                }
              }
            }
            if($sample.Key -eq 'fair_spin_bootstrap'){
              foreach($script in $scriptFiles){
                $relative=$script.FullName.Substring($out.Length+1)
                $lines=@(Get-Content -LiteralPath $script.FullName)
                Write-Host "WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE_BEGIN path=$relative total=$($lines.Count)"
                for($idx=0;$idx -lt [Math]::Min($lines.Count,200);$idx++){
                  Write-Host ("WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE {0}:{1} {2}" -f $relative,($idx+1),$lines[$idx])
                }
                Write-Host "WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE_END path=$relative"
              }
            }
            if($sample.Key -eq 'fair_spin_main'){
              $found=@($scriptFiles | Select-String -Pattern 'undefined|main.swf|bootstrap.swf|game_configs|spin\\/|getPath|gameURL|GameURL|send.*Game|loadMovie|loadBytes|getGame|showGame' -CaseSensitive:$false | Select-Object -First 180 | ForEach-Object {
                '{0}:{1} {2}' -f $_.Path.Substring($out.Length+1),$_.LineNumber,$_.Line.Trim()
              })
              Write-Host "WADDLE_FAIR_SPIN_MAIN_REFERENCES=$($found.Count)"
              foreach($line in $found){Write-Host "WADDLE_FAIR_SPIN_MAIN_REFERENCE $line"}
            }
          $fairScripts=Join-Path $work 'fair_spin_main\scripts'
          $primary=@(
            'frame_1\DoAction.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\party\MayParty.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\vo\MayPartyCookieVO.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\party\MayPartyConstants.as',
            '__Packages\com\clubpenguin\spin\Game.as'
          )
          foreach($relative in $primary){
            $file=Join-Path $fairScripts $relative
            if(-not(Test-Path -LiteralPath $file -PathType Leaf)){
              Write-Host "WADDLE_FAIR_SOURCE_MISSING=$relative"
              continue
            }
            $lines=@(Get-Content -LiteralPath $file)
            $limit=if($relative -like '*MayParty.as') {340} elseif($relative -like '*Game.as') {125} else {190}
            Write-Host "WADDLE_FAIR_SOURCE_BEGIN file=$relative lines=$($lines.Count) shown=$([Math]::Min($limit,$lines.Count))"
            for($idx=0;$idx -lt [Math]::Min($limit,$lines.Count);$idx++){
              Write-Host ("WADDLE_FAIR_SOURCE {0}:{1} {2}" -f $relative,($idx+1),$lines[$idx])
            }
            Write-Host "WADDLE_FAIR_SOURCE_END file=$relative"
          }
          }
})
              foreach($file in $plazaCode){
                $lines=@(Get-Content -LiteralPath $file.FullName)
                Write-Host "WADDLE_FAIR_PLAZA_SOURCE_BEGIN sample=$($sample.Key) path=$($file.FullName.Substring($out.Length+1)) count=$($lines.Count)"
                for($n=0;$n -lt [Math]::Min($lines.Count,560);$n++){
                  Write-Host ("WADDLE_FAIR_PLAZA_SOURCE sample={0} path={1}:{2} {3}" -f $sample.Key,$file.FullName.Substring($out.Length+1),($n+1),$lines[$n])
                }
              }
            }
            if($sample.Key -in @('fair_plaza','fair_plaza_mall','archived_stage_may','fair_map_derived')){
              $source=@($scriptFiles | Select-String -Pattern 'stage|mall|340|gotoroom|joinRoom|joinroom|puffle|hotel|pet|pufflepark|pufflewild|puffle_shop|puffleShop|\.onRelease|\.onPress|clickMap|goThereBtn' -CaseSensitive:$false | Select-Object -First 185 | ForEach-Object {
                '{0}:{1} {2}' -f $_.Path.Substring($out.Length+1),$_.LineNumber,$_.Line.Trim()
              })
              Write-Host "WADDLE_FAIR_STAGE_MAP_AUDIT sample=$($sample.Key) matches=$($source.Count)"
              foreach($entry in $source){Write-Host "WADDLE_FAIR_STAGE_MAP_AUDIT sample=$($sample.Key) $entry"}
              if($sample.Key -eq 'fair_plaza' -or $sample.Key -eq 'fair_map_derived'){
                foreach($candidate in @('scripts/frame_1/DoAction.as','scripts/frame_2/DoAction.as')){
                  $srcFile=Join-Path $out $candidate
                  if(-not(Test-Path -LiteralPath $srcFile)){continue}
                  $text=@(Get-Content -LiteralPath $srcFile)
                  for($n=0;$n -lt [Math]::Min($text.Count,850);$n++){
                    Write-Host ("WADDLE_FAIR_STAGE_MAP_CODE sample={0} path={1}:{2} {3}" -f $sample.Key,$candidate,($n+1),$text[$n])
                  }
                }
              }
            }
            if($sample.Key -eq 'fair_spin_bootstrap'){
              foreach($script in $scriptFiles){
                $relative=$script.FullName.Substring($out.Length+1)
                $lines=@(Get-Content -LiteralPath $script.FullName)
                Write-Host "WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE_BEGIN path=$relative total=$($lines.Count)"
                for($idx=0;$idx -lt [Math]::Min($lines.Count,200);$idx++){
                  Write-Host ("WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE {0}:{1} {2}" -f $relative,($idx+1),$lines[$idx])
                }
                Write-Host "WADDLE_FAIR_SPIN_BOOTSTRAP_SOURCE_END path=$relative"
              }
            }
            if($sample.Key -eq 'fair_spin_main'){
              $found=@($scriptFiles | Select-String -Pattern 'undefined|main.swf|bootstrap.swf|game_configs|spin\\/|getPath|gameURL|GameURL|send.*Game|loadMovie|loadBytes|getGame|showGame' -CaseSensitive:$false | Select-Object -First 180 | ForEach-Object {
                '{0}:{1} {2}' -f $_.Path.Substring($out.Length+1),$_.LineNumber,$_.Line.Trim()
              })
              Write-Host "WADDLE_FAIR_SPIN_MAIN_REFERENCES=$($found.Count)"
              foreach($line in $found){Write-Host "WADDLE_FAIR_SPIN_MAIN_REFERENCE $line"}
            }
          $fairScripts=Join-Path $work 'fair_spin_main\scripts'
          $primary=@(
            'frame_1\DoAction.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\party\MayParty.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\vo\MayPartyCookieVO.as',
            '__Packages\com\clubpenguin\world\rooms2015\may\party\MayPartyConstants.as',
            '__Packages\com\clubpenguin\spin\Game.as'
          )
          foreach($relative in $primary){
            $file=Join-Path $fairScripts $relative
            if(-not(Test-Path -LiteralPath $file -PathType Leaf)){
              Write-Host "WADDLE_FAIR_SOURCE_MISSING=$relative"
              continue
            }
            $lines=@(Get-Content -LiteralPath $file)
            $limit=if($relative -like '*MayParty.as') {340} elseif($relative -like '*Game.as') {125} else {190}
            Write-Host "WADDLE_FAIR_SOURCE_BEGIN file=$relative lines=$($lines.Count) shown=$([Math]::Min($limit,$lines.Count))"
            for($idx=0;$idx -lt [Math]::Min($limit,$lines.Count);$idx++){
              Write-Host ("WADDLE_FAIR_SOURCE {0}:{1} {2}" -f $relative,($idx+1),$lines[$idx])
            }
            Write-Host "WADDLE_FAIR_SOURCE_END file=$relative"
          }
          }
