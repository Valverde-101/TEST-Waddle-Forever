name: Waddle Flash Runtime Gate

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

env:
  WADDLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: waddle-canonical-workspace
  cancel-in-progress: false

jobs:
  flash-runtime:
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 180

    steps:
      - name: Resolve AndroidBuild Core and exact Waddle SHA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:OS -ne 'Windows_NT' -or -not [Environment]::Is64BitOperatingSystem -or -not [Environment]::Is64BitProcess){throw 'FLASH_GATE=FAIL windows_x64_required'}
          $roots=New-Object System.Collections.Generic.List[string]
          if($env:ANDROIDBUILD_ROOT){$roots.Add([string]$env:ANDROIDBUILD_ROOT)}
          foreach($drive in [IO.DriveInfo]::GetDrives()){
            try {
              if(-not $drive.IsReady){continue}
              $candidate=[IO.Path]::Combine($drive.RootDirectory.FullName,'AndroidBuild')
              if(-not $roots.Contains($candidate)){$roots.Add($candidate)}
            } catch {}
          }
          $root=$null
          foreach($candidate in $roots){
            try{$full=(Resolve-Path -LiteralPath $candidate -ErrorAction Stop).Path}catch{continue}
            if(Test-Path -LiteralPath (Join-Path $full 'Core\Current\AndroidBuild.psd1') -PathType Leaf){$root=$full;break}
          }
          if(-not $root){throw 'FLASH_GATE=FAIL androidbuild_core_not_found'}
          $env:ANDROIDBUILD_ROOT=$root
          "ANDROIDBUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Import-Module (Join-Path $root 'Core\Current\AndroidBuild.psd1') -Force
          Enable-AndroidBuildPortableTools -AndroidBuildRoot $root | Out-Null
          $version=[string](Get-AndroidBuildCoreVersion)
          if([version]$version -lt [version]'3.0.17'){throw "FLASH_GATE=FAIL core_required=3.0.17 actual=$version"}
          $repo=Join-Path $root 'Repositories\TEST-Waddle-Forever'
          $sync=Sync-AndroidBuildRepositoryExactHead `
            -RepoRoot $repo `
            -ExpectedSha $env:WADDLE_EXPECTED_SHA `
            -AndroidBuildRoot $root `
            -AllowTrackedReset `
            -CleanUntracked `
            -SourceRemote 'https://github.com/${{ github.repository }}.git' `
            -FetchTimeoutSeconds 7200 `
            -FetchDepth 1
          if([string]$sync.actual_sha -ne [string]$env:WADDLE_EXPECTED_SHA){throw "FLASH_GATE=FAIL exact_head expected=$env:WADDLE_EXPECTED_SHA actual=$($sync.actual_sha)"}
          "WADDLE_CANONICAL_REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "FLASH_GATE_EXACT_HEAD=PASS sha=$($sync.actual_sha) core=$version platform=windows-x64"

      - name: Prepare Waddle build environment
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Push-Location $env:WADDLE_CANONICAL_REPO
          try {
            $env:WADDLE_NONINTERACTIVE='1'
            & cmd.exe /d /c 'Waddle-Setup.cmd'
            if($LASTEXITCODE -ne 0){throw "FLASH_GATE=FAIL setup_exit=$LASTEXITCODE"}
          } finally {
            Remove-Item Env:WADDLE_NONINTERACTIVE -ErrorAction SilentlyContinue
            Pop-Location
          }
          Write-Host 'FLASH_GATE_SETUP=PASS'

      - name: Build exact Waddle source before external runtime deployment
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Import-Module (Join-Path $env:ANDROIDBUILD_ROOT 'Core\Current\AndroidBuild.psd1') -Force
          $result=Invoke-AndroidBuildBuild `
            -RepoRoot $env:WADDLE_CANONICAL_REPO `
            -AndroidBuildRoot $env:ANDROIDBUILD_ROOT `
            -ExpectedSha $env:WADDLE_EXPECTED_SHA `
            -Repository '${{ github.repository }}' `
            -RunId '${{ github.run_id }}' `
            -JobId '${{ github.job }}-flash' `
            -RunnerName $env:RUNNER_NAME `
            -LeaseWaitSeconds 1200
          if([string]$result.status -ne 'PASS'){throw "FLASH_GATE=FAIL build_status=$($result.status)"}
          if([string]$result.provenance.source_sha -ne [string]$env:WADDLE_EXPECTED_SHA){throw "FLASH_GATE=FAIL provenance_sha=$($result.provenance.source_sha) expected=$env:WADDLE_EXPECTED_SHA"}
          Write-Host "FLASH_GATE_BUILD=PASS sha=$($result.provenance.source_sha)"

      - name: Prove boots.swf from external deployed runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo=$env:WADDLE_CANONICAL_REPO
          . (Join-Path $repo '.github\scripts\waddle-common.ps1')
          . (Join-Path $repo '.github\scripts\waddle-local-runtime.ps1')
          . (Join-Path $repo '.github\scripts\waddle-workspace-resilience.ps1')
          $work=Join-Path $repo '.work'
          $deps=Invoke-WaddleDependencyBootstrap -RepoRoot $repo -WorkRoot $work
          $sourceElectron=Test-WaddleElectronRuntime -WorkRoot $work -ExpectedVersion $deps.electron
          $sourceFlash=Test-WaddlePepperFlash -RepoRoot $repo
          $runtime=New-WaddleRuntimeSnapshot -RepoRoot $repo -WorkRoot $work -ElectronExecutable $sourceElectron.executable -ElectronVersion $sourceElectron.version -PepperFlashPath $sourceFlash.path -PepperFlashVersion $sourceFlash.version -SourceSha $env:WADDLE_EXPECTED_SHA -DependencyFingerprint $deps.fingerprint

          $workFull=[IO.Path]::GetFullPath($work).TrimEnd('\')+'\'
          foreach($p in @($runtime.root,$runtime.electron_executable,$runtime.ppapi_flash_path,$runtime.app_entry,$runtime.runtime_node_modules)){
            if(([IO.Path]::GetFullPath([string]$p)).StartsWith($workFull,[StringComparison]::OrdinalIgnoreCase)){throw "FLASH_GATE=FAIL runtime_inside_work=$p"}
          }

          # Run the existing production Flash probe from the deployed app root so
          # __dirname resolves to the external runtime, not to the source tree.
          $probeDir=Join-Path $runtime.app_root 'scripts'
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $probe=Join-Path $probeDir 'flash-runtime-probe.js'
          Copy-Item -LiteralPath (Join-Path $repo 'scripts\flash-runtime-probe.js') -Destination $probe -Force

          $electron=$runtime.electron_executable
          $state=Join-Path $work 'state\flash-runtime-probe.json'
          $runtimeLogs=Join-Path $work 'logs\runtime'
          New-Item -ItemType Directory -Force -Path $runtimeLogs | Out-Null
          $stdout=Join-Path $runtimeLogs 'flash-runtime-probe.stdout.log'
          $stderr=Join-Path $runtimeLogs 'flash-runtime-probe.stderr.log'
          Remove-Item -LiteralPath $state,$stdout,$stderr -Force -ErrorAction SilentlyContinue
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          $env:WADDLE_FLASH_PROBE_RESULT=$state
          $env:WADDLE_PPAPI_FLASH_PATH=$runtime.ppapi_flash_path
          $env:WADDLE_PPAPI_FLASH_VERSION=$runtime.ppapi_flash_version
          $env:WADDLE_RUNTIME_ROOT=$runtime.root
          $env:WADDLE_RUNTIME_NODE_MODULES=$runtime.runtime_node_modules
          $env:WADDLE_NODE_MODULES=$runtime.runtime_node_modules
          $env:NODE_PATH=$runtime.runtime_node_modules
          $arg='"'+$probe+'"'
          $process=Start-Process -FilePath $electron -ArgumentList $arg -WorkingDirectory $runtime.app_root -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          if(-not $process.WaitForExit(40000)){
            try{$process.Kill()}catch{}
            throw "FLASH_GATE=FAIL probe_timeout stdout=$stdout stderr=$stderr"
          }
          $process.Refresh()
          if(Test-Path -LiteralPath $stdout){Get-Content -LiteralPath $stdout | Write-Host}
          if(Test-Path -LiteralPath $stderr){Get-Content -LiteralPath $stderr | Write-Host}
          if(-not(Test-Path -LiteralPath $state -PathType Leaf)){throw "FLASH_GATE=FAIL state_missing stdout=$stdout stderr=$stderr"}
          $result=Get-Content -LiteralPath $state -Raw | ConvertFrom-Json
          if([string]$result.status -ne 'PASS'){throw "FLASH_GATE=FAIL renderer_status=$($result.status) reason=$($result.reason)"}
          if([IO.Path]::GetFullPath([string]$result.plugin_path) -ne [IO.Path]::GetFullPath([string]$runtime.ppapi_flash_path)){throw "FLASH_GATE=FAIL plugin_not_external_runtime actual=$($result.plugin_path) expected=$($runtime.ppapi_flash_path)"}
          if([int]$result.root_status -ne 200 -or [int]$result.boots_status -ne 200){throw "FLASH_GATE=FAIL http root=$($result.root_status) boots=$($result.boots_status)"}
          if([string]$result.boots_content_type -notmatch 'application/x-shockwave-flash'){throw "FLASH_GATE=FAIL boots_mime=$($result.boots_content_type)"}
          if(-not [bool]$result.html_has_boots_object -or -not [bool]$result.renderer.mimePresent -or -not [bool]$result.renderer.mimeEnabledPlugin){throw 'FLASH_GATE=FAIL flash_contract_missing'}
          if(@($result.flash_plugins).Count -lt 1 -or -not [bool]$result.renderer.objectPresent){throw 'FLASH_GATE=FAIL flash_plugin_not_exposed'}
          if([bool]$result.fallback_visible -or -not [bool]$result.scriptable_flash_object -or -not [bool]$result.production_instantiated){throw 'FLASH_GATE=FAIL production_flash_not_instantiated'}
          if([int]$process.ExitCode -ne 0){throw "FLASH_GATE=FAIL probe_exit=$($process.ExitCode)"}
          Write-Host "FLASH_GATE=PASS platform=windows-x64 runtime=$($runtime.root) app=$($runtime.app_root) electron=$($result.electron) chromium=$($result.chromium) plugin=$($result.plugin_path) root=$($result.root_status) boots=$($result.boots_status) instantiated=$($result.production_instantiated) work_execution=false"
