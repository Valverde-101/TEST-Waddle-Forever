name: One-shot fast restore puffle trick protocol

on:
  push:
    branches:
      - fix/runtime-outside-work-20260906

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Restore puffletrick registration through GitHub API
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $file = 'src/server/socket-server/world-handlers.ts'
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $escapedPath = ($file -split '/' | ForEach-Object { [uri]::EscapeDataString($_) }) -join '/'
          $getUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/contents/${escapedPath}?ref=$env:GITHUB_REF_NAME"
          $response = Invoke-RestMethod -Headers $headers -Uri $getUri -Method Get
          $bytes = [Convert]::FromBase64String(([string]$response.content -replace '\s',''))
          $text = [Text.Encoding]::UTF8.GetString($bytes)
          $originalText = $text
          $nl = if ($text.Contains("`r`n")) { "`r`n" } else { "`n" }

          if (-not $text.Contains('import { handlePuffleTrick } from "./handlers/puffle-trick";')) {
            $puffleImport = [regex]::Match($text, '(?m)^import \{[^\r\n]+\} from "\./handlers/puffle";')
            if (-not $puffleImport.Success) { throw 'PUFFLE_TRICK_RESTORE=FAIL puffle_import_anchor_not_found' }
            $insertAt = $puffleImport.Index + $puffleImport.Length
            $text = $text.Insert($insertAt, $nl + 'import { handlePuffleTrick } from "./handlers/puffle-trick";')
          }

          $route = "    r.xt('s', 'p#puffletrick', ['number'], handlePuffleTrick),"
          if (-not $text.Contains($route)) {
            $anchor = "    p.xt('s', 'p#puffleswap', ['number', 'string'], handlePuffleBackyardSwap),"
            $anchorIndex = $text.IndexOf($anchor, [StringComparison]::Ordinal)
            if ($anchorIndex -lt 0) { throw 'PUFFLE_TRICK_RESTORE=FAIL puffle_route_anchor_not_found' }
            $text = $text.Insert($anchorIndex + $anchor.Length, $nl + $route)
          }

          if (-not $text.Contains('import { handlePuffleTrick } from "./handlers/puffle-trick";') -or -not $text.Contains($route)) { throw 'PUFFLE_TRICK_RESTORE=FAIL invariant_missing' }
          if (-not $text.Contains("    p.xt('s', 'l#mg', ['number'], handleGetMail),")) { throw 'PUFFLE_TRICK_RESTORE=FAIL mail_contract_changed' }
          if ($text -eq $originalText) { Write-Host 'PUFFLE_TRICK_RESTORE=SKIP already_present=true'; exit 0 }

          $payload = @{
            message = 'fix(puffle): restore puffletrick protocol registration'
            content = [Convert]::ToBase64String([Text.UTF8Encoding]::new($false).GetBytes($text))
            sha = [string]$response.sha
            branch = $env:GITHUB_REF_NAME
          } | ConvertTo-Json -Depth 4
          $putUri = "$env:GITHUB_API_URL/repos/$env:GITHUB_REPOSITORY/contents/$escapedPath"
          $result = Invoke-RestMethod -Headers $headers -Uri $putUri -Method Put -Body $payload -ContentType 'application/json'
          Write-Host "PUFFLE_TRICK_RESTORE=PASS file=$file commit=$($result.commit.sha) route=p#puffletrick"
