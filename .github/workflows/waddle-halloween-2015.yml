name: Waddle Halloween Party 2015 Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - '.github/manifests/halloween-2015-canonical.json'
      - '.github/scripts/waddle-party-runtime.ps1'
      - '.github/scripts/waddle-party-hardening.ps1'
      - '.github/scripts/waddle-timeline-modern.ps1'
      - '.github/scripts/waddle-halloween-2015.ps1'
      - '.github/scripts/waddle-halloween-2015-canonical.ps1'
      - '.github/scripts/waddle-halloween-2015-source.ps1'
      - '.github/scripts/waddle-halloween-2015-data.ps1'
      - '.github/scripts/waddle-halloween-2015-localization.ps1'
      - '.github/scripts/waddle-halloween-2015-paths.ps1'
      - '.github/scripts/waddle-halloween-2015-rooms.ps1'
      - '.github/scripts/waddle-halloween-2015-postfix.ps1'
      - '.github/scripts/waddle-halloween-2015-verify.ps1'
      - '.github/scripts/waddle-halloween-2015-protocol.ps1'
      - '.github/scripts/waddle-halloween-2015-dialogues.ps1'
      - '.github/scripts/waddle-halloween-2015-versioning.ps1'
      - '.github/scripts/waddle-halloween-2015-gameplay.ps1'
      - '.github/workflows/waddle-halloween-2015.yml'
      - '.gitignore'
      - 'media/default/party2015/**'
      - 'src/server/updates/2015.ts'
      - 'src/server/updates/index.ts'
      - 'src/server/timelines/game-data.ts'
      - 'src/server/game-data/files.ts'
      - 'src/server/game-data/rooms.ts'
      - 'src/server/game-data/party.ts'
      - 'src/server/game-logic/party-progress.ts'
      - 'src/server/database/database.ts'
      - 'src/server/socket-server/world/world-penguin.ts'
      - 'src/server/socket-server/xt-handler.ts'
      - 'src/server/socket-server/handlers/protocol.ts'
      - 'src/server/socket-server/handlers/join.ts'
      - 'src/server/socket-server/handlers/party.ts'
      - 'src/server/socket-server/handlers/puffle.ts'
      - 'src/server/socket-server/world-handlers.ts'
      - 'src/server/file-generators/general.json.ts'
      - 'src/server/file-generators/index.ts'
      - 'src/client/views/timeline/timeline.ts'
      - 'src/client/views/timeline/timeline-static.ts'
      - 'src/client/views/timeline/timeline.html'

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

concurrency:
  group: waddle-halloween-2015-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  validate-pr-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Validate source and preserved modern-party contract
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./.github/scripts/waddle-halloween-2015-source.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-halloween-2015-data.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-halloween-2015-localization.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-halloween-2015-paths.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-halloween-2015-rooms.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-halloween-2015-postfix.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-halloween-2015-versioning.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-halloween-2015-gameplay.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-timeline-modern.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          $changes = @(git status --porcelain)
          if($LASTEXITCODE -ne 0){throw "WADDLE_PARTY2015_SOURCE_GATE=FAIL git_status_exit=$LASTEXITCODE"}
          if($changes.Count -gt 0){$changes | ForEach-Object { Write-Host $_ }; throw "WADDLE_PARTY2015_SOURCE_GATE=FAIL generated_diff_count=$($changes.Count)"}
          Write-Host 'WADDLE_PARTY2015_SOURCE_GATE=PASS generated_diff_count=0 architecture=data_driven timeline=data_driven assets=manifest_driven runtime=preserved interactions=preserved localization=complete-contract paths=preserved-literal rooms=preserved-id-parity'

  hydrate-publish-and-verify-assets:
    needs: validate-pr-source
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Hydrate historical assets plus canonical runtime in exact PR worktree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015.ps1') -Mode assets -RepoRoot $env:GITHUB_WORKSPACE
      - name: Validate and publish complete Halloween 2015 stack
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $target=Join-Path $env:GITHUB_WORKSPACE 'media\default\party2015'
          if(-not(Test-Path -LiteralPath $target -PathType Container)){throw "WADDLE_PARTY2015_PUBLISH=FAIL target_missing=$target"}

          $historicalManifest=Get-Content -LiteralPath (Join-Path $target 'manifest.json') -Raw | ConvertFrom-Json
          $historicalCount=[int]$historicalManifest.requiredCount
          if($historicalCount -ne 132){throw "WADDLE_PARTY2015_PUBLISH=FAIL historical_required=$historicalCount expected=132"}
          $canonicalManifestPath=Join-Path $env:GITHUB_WORKSPACE '.github\manifests\halloween-2015-canonical.json'
          $canonicalManifest=Get-Content -LiteralPath $canonicalManifestPath -Raw | ConvertFrom-Json
          $canonicalAssets=@($canonicalManifest.assets)
          if($canonicalAssets.Count -lt 1){throw 'WADDLE_PARTY2015_PUBLISH=FAIL canonical_assets=0'}
          $canonicalSwfs=@($canonicalAssets | Where-Object {[string]$_.kind -eq 'swf'})
          $expectedSwfs=$historicalCount + $canonicalSwfs.Count

          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-versioning.ps1') -RepoRoot $env:GITHUB_WORKSPACE -PatchGenerator
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-source.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-data.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-localization.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-paths.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-rooms.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-postfix.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-gameplay.ps1') -RepoRoot $env:GITHUB_WORKSPACE
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-timeline-modern.ps1') -RepoRoot $env:GITHUB_WORKSPACE

          $swfs=@(Get-ChildItem -LiteralPath $target -Filter '*.swf' -File -Recurse)
          if($swfs.Count -ne $expectedSwfs){throw "WADDLE_PARTY2015_PUBLISH=FAIL expected_swfs=$expectedSwfs actual=$($swfs.Count) historical=$historicalCount canonical=$($canonicalSwfs.Count)"}
          foreach($entry in $canonicalSwfs){
            $rel=([string]$entry.target).Replace('/','\')
            if(-not(Test-Path -LiteralPath (Join-Path $target $rel) -PathType Leaf)){throw "WADDLE_PARTY2015_PUBLISH=FAIL canonical_swf_missing=$($entry.target)"}
          }
          $gameConfigs=Join-Path $target 'game_configs\game_configs.bin'
          if(-not(Test-Path -LiteralPath $gameConfigs -PathType Leaf)){throw 'WADDLE_PARTY2015_PUBLISH=FAIL game_configs_missing'}
          if((Get-Item -LiteralPath $gameConfigs).Length -ne 232384){throw "WADDLE_PARTY2015_PUBLISH=FAIL game_configs_bytes=$((Get-Item -LiteralPath $gameConfigs).Length)"}
          $tooLarge=@($swfs | Where-Object {$_.Length -ge 100MB}); if($tooLarge.Count -gt 0){throw "WADDLE_PARTY2015_PUBLISH=FAIL github_100mb_limit"}

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '.gitignore' 'media/default/party2015' 'src/server/updates/2015.ts' 'src/server/updates/index.ts' 'src/server/timelines/game-data.ts' 'src/server/game-data/files.ts' 'src/server/game-data/rooms.ts' 'src/server/game-data/party.ts' 'src/server/game-logic/party-progress.ts' 'src/server/database/database.ts' 'src/server/socket-server/world/world-penguin.ts' 'src/server/socket-server/xt-handler.ts' 'src/server/socket-server/handlers/protocol.ts' 'src/server/socket-server/handlers/party.ts' 'src/server/socket-server/handlers/puffle.ts' 'src/server/socket-server/world-handlers.ts' 'src/server/file-generators/general.json.ts' 'src/server/file-generators/index.ts' 'src/client/views/timeline/timeline.ts' 'src/client/views/timeline/timeline-static.ts' 'src/client/views/timeline/timeline.html'

          $cachedSwfs=@(git ls-files --cached -- 'media/default/party2015' | Where-Object {$_ -match '(?i)\.swf$'})
          if($cachedSwfs.Count -ne $expectedSwfs){throw "WADDLE_PARTY2015_PUBLISH=FAIL cached_swfs=$($cachedSwfs.Count) expected=$expectedSwfs"}
          foreach($entry in $canonicalAssets){
            $gitPath='media/default/party2015/' + ([string]$entry.target).Replace('\','/')
            $tracked=@(git ls-files --cached -- $gitPath)
            if($tracked.Count -ne 1){throw "WADDLE_PARTY2015_PUBLISH=FAIL canonical_not_tracked=$gitPath"}
          }

          $staged=@(git diff --cached --name-only)
          if($staged.Count -gt 0){
            if('${{ github.event_name }}' -eq 'pull_request'){
              $staged | ForEach-Object { Write-Host "WADDLE_PARTY2015_PUBLISH_PENDING=$_" }
              throw 'WADDLE_PARTY2015_PUBLISH=FAIL generated_changes_must_be_committed_by_author_not_bot'
            }
            git commit -m 'fix(party): publish complete preserved Halloween 2015 stack'
            $branch='${{ github.ref_name }}'
            git push origin "HEAD:$branch"
          }
          Write-Host "WADDLE_PARTY2015_PUBLISH=PASS historical_swfs=$historicalCount canonical_assets=$($canonicalAssets.Count) canonical_swfs=$($canonicalSwfs.Count) total_swfs=$expectedSwfs"
      - name: Verify historical SWFs plus all canonical runtime/config supplements
        shell: powershell
        run: ./.github/scripts/waddle-halloween-2015-verify.ps1 -RepoRoot $env:GITHUB_WORKSPACE -CanonicalRoot $env:GITHUB_WORKSPACE
      - name: Verify complete party media is Git-owned
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $party=Join-Path $env:GITHUB_WORKSPACE 'media\default\party2015'
          $historicalManifest=Get-Content -LiteralPath (Join-Path $party 'manifest.json') -Raw | ConvertFrom-Json
          $historicalCount=[int]$historicalManifest.requiredCount
          $canonicalManifest=Get-Content -LiteralPath (Join-Path $env:GITHUB_WORKSPACE '.github\manifests\halloween-2015-canonical.json') -Raw | ConvertFrom-Json
          $canonicalAssets=@($canonicalManifest.assets)
          $canonicalSwfs=@($canonicalAssets | Where-Object {[string]$_.kind -eq 'swf'})
          $expectedSwfs=$historicalCount + $canonicalSwfs.Count
          $swfs=@(Get-ChildItem -LiteralPath $party -Filter '*.swf' -File -Recurse)
          if($swfs.Count -ne $expectedSwfs){throw "WADDLE_PARTY2015_GIT_OWNERSHIP=FAIL expected_swfs=$expectedSwfs actual=$($swfs.Count)"}
          $trackedSwfs=@(git ls-files -- 'media/default/party2015' | Where-Object {$_ -match '(?i)\.swf$'})
          if($trackedSwfs.Count -ne $expectedSwfs){throw "WADDLE_PARTY2015_GIT_OWNERSHIP=FAIL tracked_swfs=$($trackedSwfs.Count) expected=$expectedSwfs"}
          foreach($entry in $canonicalAssets){
            $gitPath='media/default/party2015/' + ([string]$entry.target).Replace('\','/')
            if(@(git ls-files -- $gitPath).Count -ne 1){throw "WADDLE_PARTY2015_GIT_OWNERSHIP=FAIL canonical_untracked=$gitPath"}
          }
          $ignored=@(git check-ignore -- 'media/default/party2015/probe.swf' 2>$null); $global:LASTEXITCODE=0
          if($ignored.Count -gt 0){throw 'WADDLE_PARTY2015_GIT_OWNERSHIP=FAIL party2015_is_ignored'}
          Write-Host "WADDLE_PARTY2015_GIT_OWNERSHIP=PASS historical_swfs=$historicalCount canonical_swfs=$($canonicalSwfs.Count) total_swfs=$expectedSwfs canonical_assets=$($canonicalAssets.Count) ignored=false"

  protocol-evidence:
    needs: hydrate-publish-and-verify-assets
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 30
    steps:
      - name: Enable AndroidBuild managed Git for checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'; $gitDir='V:\AndroidBuild\Tools\Git\cmd'; if(-not(Test-Path -LiteralPath (Join-Path $gitDir 'git.exe') -PathType Leaf)){throw "WADDLE_PARTY2015_GIT=FAIL missing=$gitDir"}; $gitDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Derive Halloween 2015 protocol evidence from versioned client SWFs
        shell: powershell
        run: ./.github/scripts/waddle-halloween-2015-protocol.ps1 -RepoRoot $env:GITHUB_WORKSPACE -CanonicalRoot $env:GITHUB_WORKSPACE
      - name: Require complete original Halloween 2015 dialogue localization
        shell: powershell
        run: ./.github/scripts/waddle-halloween-2015-dialogues.ps1 -RepoRoot $env:GITHUB_WORKSPACE -RequireComplete
