name: Waddle Halloween Party 2015 Integration

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - '.github/scripts/waddle-halloween-2015.ps1'
      - '.github/scripts/waddle-halloween-2015-source.ps1'
      - '.github/scripts/waddle-halloween-2015-postfix.ps1'
      - '.github/scripts/waddle-halloween-2015-verify.ps1'
      - '.github/workflows/waddle-halloween-2015.yml'
      - '.gitignore'
      - 'src/server/updates/2015.ts'
      - 'src/server/game-data/files.ts'
      - 'src/server/game-data/rooms.ts'
      - 'src/client/views/timeline/timeline-static.ts'
      - 'src/client/views/timeline/timeline.html'

permissions:
  contents: read

concurrency:
  group: waddle-halloween-2015-${{ github.event.pull_request.number || 'manual' }}
  cancel-in-progress: true

jobs:
  validate-pr-source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert Halloween 2015 source integration is committed in the PR
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          ./.github/scripts/waddle-halloween-2015-source.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          ./.github/scripts/waddle-halloween-2015-postfix.ps1 -RepoRoot $env:GITHUB_WORKSPACE
          $changes = @(git status --porcelain)
          if($LASTEXITCODE -ne 0){throw "WADDLE_PARTY2015_SOURCE_GATE=FAIL git_status_exit=$LASTEXITCODE"}
          if($changes.Count -gt 0){
            git diff -- .gitignore src/server/updates/2015.ts src/server/game-data/files.ts src/server/game-data/rooms.ts src/client/views/timeline/timeline-static.ts src/client/views/timeline/timeline.html
            throw "WADDLE_PARTY2015_SOURCE_GATE=FAIL uncommitted_generated_changes=$($changes.Count)"
          }
          Write-Host 'WADDLE_PARTY2015_SOURCE_GATE=PASS mode=pr_owned_source mutation=false'

  hydrate-and-verify-canonical-assets:
    needs: validate-pr-source
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Hydrate complete Halloween Party 2015 archive into canonical media
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $canonical='V:\AndroidBuild\Repositories\TEST-Waddle-Forever'
          if(-not(Test-Path -LiteralPath (Join-Path $canonical '.git'))){throw "WADDLE_PARTY2015_ASSETS=FAIL expected_canonical_missing=$canonical"}
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015.ps1') -Mode assets -RepoRoot $canonical
      - name: Verify all 132 source routes resolve to canonical valid SWFs
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $canonical='V:\AndroidBuild\Repositories\TEST-Waddle-Forever'
          & (Join-Path $env:GITHUB_WORKSPACE '.github\scripts\waddle-halloween-2015-verify.ps1') -RepoRoot $env:GITHUB_WORKSPACE -CanonicalRoot $canonical
      - name: Verify party media remains outside Git ownership
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          git check-ignore -q -- 'media/default/party2015/probe.swf'
          if($LASTEXITCODE -ne 0){throw 'WADDLE_PARTY2015_GIT_OWNERSHIP=FAIL party2015_not_ignored'}
          $global:LASTEXITCODE=0
          Write-Host 'WADDLE_PARTY2015_GIT_OWNERSHIP=PASS canonical_assets_untracked=true'
