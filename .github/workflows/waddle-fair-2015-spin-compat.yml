name: Waddle The Fair 2015 Daily Spin Loopback Compatibility

on:
  pull_request:
    branches: [dev]
    paths:
      - '.github/workflows/waddle-fair-2015-spin-compat.yml'
      - '.github/scripts/waddle-fair-2015-spin-compat.py'
      - 'src/server/updates/2015.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waddle-fair-2015-spin-compat-pr-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  generate-derived-fair-spin-bootstrap:
    if: github.repository == 'Valverde-101/TEST-Waddle-Forever' && github.event_name == 'pull_request' && github.head_ref == 'feat/the-fair-2015'
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/the-fair-2015
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Derive and verify isolated, loopback-compatible Daily Spin SWF
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $ffdec = Get-ChildItem -LiteralPath 'V:\AndroidBuild\Tools\FFDec' -Filter 'ffdec-cli.exe' -Recurse -File | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $ffdec) { throw 'WADDLE_FAIR_SPIN_PATCH=FAIL ffdec_missing' }
          python .github/scripts/waddle-fair-2015-spin-compat.py --ffdec $ffdec.FullName
          if ($LASTEXITCODE -ne 0) { throw 'WADDLE_FAIR_SPIN_PATCH=FAIL python_failed' }
          git status --short -- media/default/fair2015/compat
      - name: Commit only verified derived Fair media to existing PR branch
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          $source = 'media/default/fair2015/compat/GamesSpinBootstrapLocal.swf'
          $manifest = 'media/default/fair2015/compat/spin_bootstrap_local.json'
          if (-not (Test-Path -LiteralPath $source -PathType Leaf) -or -not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw 'WADDLE_FAIR_SPIN_PATCH=FAIL derived_missing' }
          git add -- $source $manifest
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 1) {
            git commit -m "fix(fair2015): preserve patched Daily Spin bootstrap only for local runtime"
            if ($LASTEXITCODE -ne 0) { throw 'WADDLE_FAIR_SPIN_PATCH=FAIL commit' }
            git push origin HEAD:refs/heads/feat/the-fair-2015
            if ($LASTEXITCODE -ne 0) { throw 'WADDLE_FAIR_SPIN_PATCH=FAIL branch_moved_or_push_failed' }
          }
          Write-Host 'WADDLE_FAIR_SPIN_PATCH=PASS same_pr=true canonical_unchanged=true'
