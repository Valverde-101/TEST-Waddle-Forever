name: Regenerate Yarn Lock (temporary)

on:
  push:
    branches:
      - feat/androidbuild-core-waddle-local-20260905
    paths:
      - package.json
      - .github/workflows/regenerate-yarn-lock.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Sparse checkout dependency manifests only
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            package.json
            yarn.lock

      - name: Use reference Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          check-latest: false

      - name: Pin Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Regenerate lockfile without package scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf node_modules
          yarn install --non-interactive --ignore-scripts
          git diff --check -- yarn.lock
          test -s yarn.lock
          echo "LOCKFILE_GENERATION=PASS"
          git diff --stat -- yarn.lock

      - name: Commit generated lockfile to feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- yarn.lock; then
            echo "LOCKFILE_COMMIT=PASS mode=unchanged"
            exit 0
          fi
          git config user.name "Valverde AndroidBuild"
          git config user.email "96694746+Valverde-101@users.noreply.github.com"
          git add yarn.lock
          git commit -m "fix(deps): regenerate Yarn lock for dual TypeScript toolchain"
          git push origin "HEAD:${GITHUB_REF_NAME}"
          echo "LOCKFILE_COMMIT=PASS mode=pushed"
