name: Waddle Actual Start Smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]

permissions:
  contents: read

env:
  WADDLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: waddle-canonical-workspace
  cancel-in-progress: false

jobs:
  actual-start:
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 180

    steps:
      - name: Resolve Core and synchronize exact Waddle SHA
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          if($env:OS -ne 'Windows_NT' -or -not [Environment]::Is64BitOperatingSystem -or -not [Environment]::Is64BitProcess){throw 'START_SMOKE=FAIL windows_x64_required'}
          $roots=New-Object System.Collections.Generic.List[string]
          if($env:ANDROIDBUILD_ROOT){$roots.Add([string]$env:ANDROIDBUILD_ROOT)}
          foreach($drive in [IO.DriveInfo]::GetDrives()){
            try{
              if(-not $drive.IsReady){continue}
              $candidate=[IO.Path]::Combine($drive.RootDirectory.FullName,'AndroidBuild')
              if(-not $roots.Contains($candidate)){$roots.Add($candidate)}
            }catch{}
          }
          $root=$null
          foreach($candidate in $roots){
            try{$full=(Resolve-Path -LiteralPath $candidate -ErrorAction Stop).Path}catch{continue}
            if(Test-Path -LiteralPath (Join-Path $full 'Core\Current\AndroidBuild.psd1') -PathType Leaf){$root=$full;break}
          }
          if(-not $root){throw 'START_SMOKE=FAIL androidbuild_core_not_found'}
          $env:ANDROIDBUILD_ROOT=$root
          "ANDROIDBUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Import-Module (Join-Path $root 'Core\Current\AndroidBuild.psd1') -Force
          Enable-AndroidBuildPortableTools -AndroidBuildRoot $root | Out-Null
          $version=[string](Get-AndroidBuildCoreVersion)
          if([version]$version -lt [version]'3.0.17'){throw "START_SMOKE=FAIL core_required=3.0.17 actual=$version"}
          $repo=Join-Path $root 'Repositories\TEST-Waddle-Forever'
          $sync=Sync-AndroidBuildRepositoryExactHead `
            -RepoRoot $repo `
            -ExpectedSha $env:WADDLE_EXPECTED_SHA `
            -AndroidBuildRoot $root `
            -AllowTrackedReset `
            -CleanUntracked `
            -SourceRemote 'https://github.com/${{ github.repository }}.git' `
            -FetchTimeoutSeconds 7200 `
            -FetchDepth 1
          if([string]$sync.actual_sha -ne [string]$env:WADDLE_EXPECTED_SHA){throw "START_SMOKE=FAIL exact_head expected=$env:WADDLE_EXPECTED_SHA actual=$($sync.actual_sha)"}
          "WADDLE_CANONICAL_REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "START_SMOKE_EXACT_HEAD=PASS sha=$($sync.actual_sha) core=$version"

      - name: Run real Setup and Start then validate live client
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $repo=$env:WADDLE_CANONICAL_REPO
          $work=Join-Path $repo '.work'
          $statePath=Join-Path $work 'state\waddle-client.json'
          $env:WADDLE_NONINTERACTIVE='1'
          Push-Location $repo
          try {
            & cmd.exe /d /c 'Waddle-Setup.cmd'
            if($LASTEXITCODE -ne 0){throw "START_SMOKE=FAIL setup_exit=$LASTEXITCODE"}
            & cmd.exe /d /c 'Waddle-Start.cmd'
            if($LASTEXITCODE -ne 0){throw "START_SMOKE=FAIL start_exit=$LASTEXITCODE"}
            if(-not(Test-Path -LiteralPath $statePath -PathType Leaf)){throw "START_SMOKE=FAIL state_missing=$statePath"}
            $state=Get-Content -LiteralPath $statePath -Raw | ConvertFrom-Json
            if([string]$state.status -ne 'RUNNING'){throw "START_SMOKE=FAIL state_status=$($state.status)"}
            if([string]$state.source_sha -ne [string]$env:WADDLE_EXPECTED_SHA){throw "START_SMOKE=FAIL source_sha=$($state.source_sha) expected=$env:WADDLE_EXPECTED_SHA"}
            if([string]$state.runtime_mode -ne 'external_deployment'){throw "START_SMOKE=FAIL runtime_mode=$($state.runtime_mode)"}
            $workFull=[IO.Path]::GetFullPath($work).TrimEnd('\')+'\'
            foreach($p in @($state.runtime_root,$state.runtime_app_entry,$state.runtime_node_modules,$state.electron_executable,$state.ppapi_flash_path)){
              if([string]::IsNullOrWhiteSpace([string]$p)){throw 'START_SMOKE=FAIL runtime_path_empty'}
              $full=[IO.Path]::GetFullPath([string]$p)
              if($full.StartsWith($workFull,[StringComparison]::OrdinalIgnoreCase)){throw "START_SMOKE=FAIL runtime_inside_work=$full"}
            }
            $expectedHome=[IO.Path]::GetFullPath((Join-Path $env:ANDROIDBUILD_ROOT 'Runtime\Waddle-Forever')).TrimEnd('\')+'\'
            $runtimeRoot=[IO.Path]::GetFullPath([string]$state.runtime_root)
            if(-not $runtimeRoot.StartsWith($expectedHome,[StringComparison]::OrdinalIgnoreCase)){throw "START_SMOKE=FAIL runtime_home actual=$runtimeRoot expected=$expectedHome"}
            $client=Get-Process -Id ([int]$state.pid) -ErrorAction Stop
            if($client.HasExited){throw "START_SMOKE=FAIL client_exited pid=$($state.pid)"}
            if(-not(Test-Path -LiteralPath ([string]$state.runtime_app_entry) -PathType Leaf)){throw "START_SMOKE=FAIL app_entry_missing=$($state.runtime_app_entry)"}
            if(-not(Test-Path -LiteralPath ([string]$state.runtime_node_modules) -PathType Container)){throw "START_SMOKE=FAIL runtime_modules_missing=$($state.runtime_node_modules)"}
            Write-Host "WADDLE_ACTUAL_START=PASS pid=$($state.pid) sha=$($state.source_sha) runtime=$($state.runtime_root) electron=$($state.electron_executable) app=$($state.runtime_app_entry) work_execution=false"
          } finally {
            try {
              & cmd.exe /d /c 'Waddle-Stop.cmd'
              $global:LASTEXITCODE=0
            } catch {}
            Remove-Item Env:WADDLE_NONINTERACTIVE -ErrorAction SilentlyContinue
            Pop-Location
          }
