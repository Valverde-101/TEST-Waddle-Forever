name: Waddle Command Center Live Publish

on:
  workflow_dispatch:
  pull_request:
    branches: [dev]
    paths:
      - 'src/client/views/commands/**'
      - '.github/workflows/waddle-command-center-live.yml'

permissions:
  contents: read

env:
  WADDLE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: waddle-command-center-live-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  publish-command-center:
    runs-on: [self-hosted, Windows, X64, windows-build, android-parallel, pc-willthom, general]
    timeout-minutes: 10

    steps:
      - name: Resolve portable AndroidBuild Git before checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $roots=New-Object System.Collections.Generic.List[string]
          if($env:ANDROIDBUILD_ROOT){$roots.Add([string]$env:ANDROIDBUILD_ROOT)}
          foreach($drive in [IO.DriveInfo]::GetDrives()){
            try{
              if(-not $drive.IsReady){continue}
              $candidate=[IO.Path]::Combine($drive.RootDirectory.FullName,'AndroidBuild')
              if(-not $roots.Contains($candidate)){$roots.Add($candidate)}
            }catch{}
          }
          $root=$null
          foreach($candidate in $roots){
            try{$full=(Resolve-Path -LiteralPath $candidate -ErrorAction Stop).Path}catch{continue}
            if(Test-Path -LiteralPath (Join-Path $full 'Tools\Node\20.19.0\x64\node.exe') -PathType Leaf){$root=$full;break}
          }
          if(-not $root){throw 'COMMAND_CENTER_LIVE=FAIL androidbuild_root_not_found'}
          $gitExe=Join-Path $root 'Tools\Git\cmd\git.exe'
          if(-not(Test-Path -LiteralPath $gitExe -PathType Leaf)){throw "COMMAND_CENTER_LIVE=FAIL managed_git_missing=$gitExe"}
          "ANDROIDBUILD_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WADDLE_GIT_EXE=$gitExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $gitExe) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "COMMAND_CENTER_LIVE_GIT=PASS root=$root git=$gitExe canonical_repo_mutation=false"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          clean: true
          fetch-depth: 1

      - name: Prepare isolated Command Center build
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $root=$env:ANDROIDBUILD_ROOT
          $gitExe=$env:WADDLE_GIT_EXE
          $workRepo=(Resolve-Path -LiteralPath $env:GITHUB_WORKSPACE -ErrorAction Stop).Path
          $liveRepo=Join-Path $root 'Repositories\TEST-Waddle-Forever'
          $sourceModules=Join-Path $liveRepo 'node_modules'
          if(-not(Test-Path -LiteralPath (Join-Path $liveRepo '.git'))){throw "COMMAND_CENTER_LIVE=FAIL live_repo_missing=$liveRepo"}
          if(-not(Test-Path -LiteralPath $sourceModules -PathType Container)){throw "COMMAND_CENTER_LIVE=FAIL node_modules_missing=$sourceModules"}

          $actual=(& $gitExe -c "safe.directory=$workRepo" -C $workRepo rev-parse HEAD 2>&1 | Out-String).Trim().ToLowerInvariant()
          $expected=$env:WADDLE_EXPECTED_SHA.Trim().ToLowerInvariant()
          $global:LASTEXITCODE=0
          if($actual -ne $expected){throw "COMMAND_CENTER_LIVE=FAIL exact_head expected=$expected actual=$actual"}

          $targetModules=Join-Path $workRepo 'node_modules'
          if(Test-Path -LiteralPath $targetModules){
            $item=Get-Item -LiteralPath $targetModules -Force
            if($item.Attributes -band [IO.FileAttributes]::ReparsePoint){& cmd.exe /d /c "rmdir `"$targetModules`"" | Out-Null}else{Remove-Item -LiteralPath $targetModules -Recurse -Force}
            $global:LASTEXITCODE=0
          }
          New-Item -ItemType Junction -Path $targetModules -Target $sourceModules -ErrorAction Stop | Out-Null

          "WADDLE_LIVE_REPO=$liveRepo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WADDLE_COMMAND_BUILD_REPO=$workRepo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "COMMAND_CENTER_LIVE_PREP=PASS sha=$actual workspace=$workRepo live_repo=$liveRepo dependency_mode=read_only_junction canonical_git_fetch=false canonical_worktree=false"

      - name: Build exact-SHA Command Center
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $nodeHome=Join-Path $env:ANDROIDBUILD_ROOT 'Tools\Node\20.19.0\x64'
          $node=Join-Path $nodeHome 'node.exe'
          $yarn=Join-Path $nodeHome 'yarn.cmd'
          $modules=Join-Path $env:WADDLE_COMMAND_BUILD_REPO 'node_modules'
          $bin=Join-Path $modules '.bin'
          if(-not(Test-Path -LiteralPath $node -PathType Leaf)){throw "COMMAND_CENTER_LIVE=FAIL node_missing=$node"}
          if(-not(Test-Path -LiteralPath $yarn -PathType Leaf)){throw "COMMAND_CENTER_LIVE=FAIL yarn_missing=$yarn"}
          if(-not(Test-Path -LiteralPath (Join-Path $bin 'tsc-alias.cmd') -PathType Leaf)){throw "COMMAND_CENTER_LIVE=FAIL bin_missing=$bin"}
          $env:PATH="$bin;$nodeHome;$env:PATH"
          $env:NODE_PATH=$modules

          $livePackageInfo=Join-Path $env:WADDLE_LIVE_REPO 'src\server\game-data\package-info.ts'
          $buildPackageInfo=Join-Path $env:WADDLE_COMMAND_BUILD_REPO 'src\server\game-data\package-info.ts'
          if(-not(Test-Path -LiteralPath $livePackageInfo -PathType Leaf)){throw "COMMAND_CENTER_LIVE=FAIL package_info_missing=$livePackageInfo"}
          Copy-Item -LiteralPath $livePackageInfo -Destination $buildPackageInfo -Force
          Write-Host "COMMAND_CENTER_LIVE_GENERATED_INPUT=PASS package_info=$buildPackageInfo bin=$bin"

          Push-Location $env:WADDLE_COMMAND_BUILD_REPO
          try {
            & $yarn build-tsc
            $code=$LASTEXITCODE
            $global:LASTEXITCODE=0
            if($code -ne 0){throw "COMMAND_CENTER_LIVE=FAIL build_tsc_exit=$code"}
          } finally { Pop-Location }

          $compiled=Join-Path $env:WADDLE_COMMAND_BUILD_REPO 'compiled\client\views\commands'
          $required=@(
            'commands.js',
            'commands-preload.js',
            'commands-static.js',
            'commands-compat-static.js',
            'commands-item-preview.js',
            'commands.html',
            'commands.css',
            'commands-compact.css'
          )
          foreach($name in $required){
            $path=Join-Path $compiled $name
            if(-not(Test-Path -LiteralPath $path -PathType Leaf)){throw "COMMAND_CENTER_LIVE=FAIL compiled_file_missing=$path"}
          }
          Write-Host "COMMAND_CENTER_LIVE_BUILD=PASS sha=$env:WADDLE_EXPECTED_SHA files=$($required.Count)"

      - name: Publish certified Command Center to shared runtime
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          Set-StrictMode -Version Latest
          $source=Join-Path $env:WADDLE_COMMAND_BUILD_REPO 'compiled\client\views\commands'
          $canonicalDest=Join-Path $env:WADDLE_LIVE_REPO 'compiled\client\views\commands'
          $activeWorkDest=Join-Path $env:WADDLE_LIVE_REPO '.work\build\compiled\client\views\commands'
          $destinations=New-Object System.Collections.Generic.List[string]
          $destinations.Add($canonicalDest)
          if(Test-Path -LiteralPath (Split-Path -Parent $activeWorkDest) -PathType Container){
            $destinations.Add($activeWorkDest)
          }

          $required=@(
            'commands.js',
            'commands-preload.js',
            'commands-static.js',
            'commands-compat-static.js',
            'commands-item-preview.js',
            'commands.html',
            'commands.css',
            'commands-compact.css'
          )

          foreach($dest in $destinations){
            New-Item -ItemType Directory -Force -Path $dest | Out-Null
            foreach($name in $required){
              $src=Join-Path $source $name
              $dst=Join-Path $dest $name
              $tmp="$dst.new-$env:GITHUB_RUN_ID"
              Copy-Item -LiteralPath $src -Destination $tmp -Force
              Move-Item -LiteralPath $tmp -Destination $dst -Force
              if((Get-FileHash -LiteralPath $src -Algorithm SHA256).Hash -ne (Get-FileHash -LiteralPath $dst -Algorithm SHA256).Hash){throw "COMMAND_CENTER_LIVE=FAIL publish_hash_mismatch file=$name destination=$dest"}
            }
            Write-Host "COMMAND_CENTER_LIVE_DESTINATION=PASS sha=$env:WADDLE_EXPECTED_SHA destination=$dest files=$($required.Count)"
          }

          $stateDir=Join-Path $env:WADDLE_LIVE_REPO '.work\state'
          New-Item -ItemType Directory -Force -Path $stateDir | Out-Null
          [ordered]@{
            schema='waddle-command-center-live/v3'
            status='PASS'
            source_sha=$env:WADDLE_EXPECTED_SHA
            run_id=$env:GITHUB_RUN_ID
            files=$required
            destinations=@($destinations)
            source_workspace=$env:WADDLE_COMMAND_BUILD_REPO
            canonical_git_mutated=$false
            media_duplicated=$false
            published_utc=[DateTime]::UtcNow.ToString('o')
          } | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $stateDir 'command-center-live.json') -Encoding UTF8
          Write-Host "COMMAND_CENTER_LIVE_PUBLISH=PASS sha=$env:WADDLE_EXPECTED_SHA destinations=$($destinations.Count) files=$($required.Count) canonical_git_mutated=false media_duplicated=false restart_required_for_native_window_code=true"

      - name: Cleanup isolated Command Center build
        if: always()
        shell: powershell
        run: |
          $ErrorActionPreference='Continue'
          if(-not $env:WADDLE_COMMAND_BUILD_REPO){exit 0}
          $modules=Join-Path $env:WADDLE_COMMAND_BUILD_REPO 'node_modules'
          if(Test-Path -LiteralPath $modules){
            $item=Get-Item -LiteralPath $modules -Force -ErrorAction SilentlyContinue
            if($item -and ($item.Attributes -band [IO.FileAttributes]::ReparsePoint)){& cmd.exe /d /c "rmdir `"$modules`"" | Out-Null}
            $global:LASTEXITCODE=0
          }
          Write-Host 'COMMAND_CENTER_LIVE_CLEANUP=PASS canonical_git_mutated=false'