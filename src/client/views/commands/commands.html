<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="../base.css" rel="stylesheet" type="text/css" media="screen"/>
    <link href="commands.css" rel="stylesheet" type="text/css" media="screen"/>
    <title>Command Center</title>
  </head>
  <body>
    <main class="command-center">
      <header class="app-header">
        <div>
          <div class="eyebrow">WADDLE FOREVER</div>
          <h1>Command Center</h1>
          <p>Run game commands without memorizing IDs or syntax.</p>
        </div>
        <div class="header-actions">
          <button id="commandslist-button" class="ghost-button" title="Open the legacy command reference">Reference</button>
          <button id="refresh-button" class="ghost-button" title="Refresh penguins">Refresh</button>
        </div>
      </header>

      <section class="target-bar">
        <label class="field-group target-field">
          <span>Target penguin</span>
          <select id="player-select" class="select"></select>
        </label>
        <div class="connection-state" id="connection-state">
          <span class="status-dot"></span>
          <span id="player-status">Loading penguins…</span>
        </div>
      </section>

      <section class="quick-actions" aria-label="Quick actions">
        <button class="quick-action" data-command="ac 1000">
          <strong>+1,000</strong><span>Coins</span>
        </button>
        <button class="quick-action" data-command="ac 10000">
          <strong>+10,000</strong><span>Coins</span>
        </button>
        <button class="quick-action" data-select-command="ai">
          <strong>Add item</strong><span>Search by name or ID</span>
        </button>
        <button class="quick-action" data-select-command="af">
          <strong>Add furniture</strong><span>Search + quantity</span>
        </button>
        <button class="quick-action" data-select-command="jr">
          <strong>Teleport</strong><span>Choose room</span>
        </button>
      </section>

      <section class="workspace">
        <aside class="command-browser">
          <div class="browser-toolbar">
            <input id="command-search" type="search" placeholder="Search commands…  Ctrl+K" autocomplete="off" />
            <select id="category-select" class="select compact-select">
              <option value="all">All categories</option>
            </select>
          </div>
          <div id="command-list" class="command-list" role="listbox" aria-label="Available commands"></div>
        </aside>

        <section class="command-editor">
          <div id="empty-state" class="empty-state">
            <h2>Choose a command</h2>
            <p>Use search, a quick action, or select a command from the list.</p>
          </div>

          <div id="editor-content" class="editor-content hidden">
            <div class="editor-heading">
              <div>
                <div id="command-category" class="command-category">General</div>
                <h2 id="command-title">Command</h2>
              </div>
              <button id="favorite-button" class="icon-button" title="Add to favorites" aria-label="Favorite command">☆</button>
            </div>

            <p id="command-description" class="command-description"></p>

            <div id="argument-fields" class="argument-fields"></div>

            <div id="catalog-search-wrap" class="catalog-search-wrap hidden">
              <label class="field-group">
                <span id="catalog-label">Search catalog</span>
                <input id="catalog-search" type="search" autocomplete="off" placeholder="Type a name or ID…" />
              </label>
              <div id="catalog-results" class="catalog-results"></div>
            </div>

            <div id="examples-wrap" class="examples-wrap hidden">
              <span class="section-label">Examples</span>
              <div id="examples" class="examples"></div>
            </div>

            <label class="field-group command-preview-group">
              <span>Command preview</span>
              <input id="command-input" type="text" autocomplete="off" spellcheck="false" placeholder="Command" />
            </label>

            <div class="run-row">
              <div id="command-status" class="command-status neutral">Ready</div>
              <button id="command-button" class="primary-button">Run command <span>Ctrl+Enter</span></button>
            </div>
          </div>
        </section>
      </section>

      <section class="activity-panel">
        <div class="activity-heading">
          <div>
            <span class="section-label">Recent activity</span>
            <span class="muted">Stored locally on this PC</span>
          </div>
          <button id="clear-history" class="link-button">Clear history</button>
        </div>
        <div id="history-list" class="history-list"></div>
      </section>
    </main>

    <script>var exports = {};</script>
    <script src="commands-static.js"></script>
    <script src="commands-enhancements.js"></script>
  </body>
</html>
